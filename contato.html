<!DOCTYPE html>
<html lang="Pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="src/css/estilos.css">
</head>

<body>
    <header class="header-container">
        <h2 class="logo"><a href="index.html">Hugo Melo</a></h2>

        <nav class="nav-menu" id="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="sobre.html">Sobre</a>
            <a href="projetos.html">Projetos</a>
            <a href="contato.html" class="active">Contato</a>
        </nav>

        <button class="menu-hamburger" id="menu-hamburger" aria-label="Abrir menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </header>
    <main>
        <section class="contact-section">
            <h2>Entre em Contato</h2>
            <form class="contact-form" id="form-contato">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome">
                </div>

                <div class="form-group"> <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Digite seu email">
                </div>

                <div class="form-group"> <label for="assunto">Assunto:</label>
                    <input type="text" id="assunto" placeholder="Motivo do contato">
                </div>

                <div class="form-group"> <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer class="footer-container">
        <p>© 2026 Hugo Melo — Todos os direitos reservados</p>
    </footer>

    <script src="src/js/script.js"></script>
</body>

</html>
